<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">📦 InvSys</span>
      <span class="subtitle">Sistema de Inventario</span>
    </div>
    <span class="date" id="liveDate"></span>
  </header>

  <main class="container">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Productos</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card green">
        <span class="stat-label">En Stock</span>
        <span class="stat-value" id="statOk">0</span>
      </div>
      <div class="stat-card yellow">
        <span class="stat-label">Stock Bajo</span>
        <span class="stat-value" id="statLow">0</span>
      </div>
      <div class="stat-card red">
        <span class="stat-label">Sin Stock</span>
        <span class="stat-value" id="statOut">0</span>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." />
      <select id="filterCategory">
        <option value="">Todas las categorías</option>
        <option>Electrónica</option>
        <option>Ropa</option>
        <option>Alimentos</option>
        <option>Oficina</option>
      </select>
      <button class="btn-add" id="openModal">+ Agregar</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>

  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Agregar Producto</h2>
        <button id="closeModal">✕</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="editId"/>

        <label>Nombre</label>
        <input type="text" id="fName" placeholder="Ej: Monitor 24'" required/>

        <div class="form-row">
          <div>
            <label>Categoría</label>
            <select id="fCategory" required>
              <option value="">Seleccionar...</option>
              <option>Electrónica</option>
              <option>Ropa</option>
              <option>Alimentos</option>
              <option>Oficina</option>
            </select>
          </div>
          <div>
            <label>Stock</label>
            <input type="number" id="fStock" placeholder="0" min="0" required/>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label>Precio ($)</label>
            <input type="number" id="fPrice" placeholder="0.00" min="0" step="0.01" required/>
          </div>
          <div>
            <label>Stock Mínimo</label>
            <input type="number" id="fMinStock" value="5" min="0"/>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="cancelModal" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
